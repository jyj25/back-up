<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카메라 두 대 · 라즈봇</title>
<style>
  body { margin: 0; background: #10181c; color: #e6ebe8; font-family: system-ui, sans-serif; }
  header { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 16px; }
  h1 { font-size: 18px; margin: 0; }
  a { color: #f4c21e; }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; padding: 0 16px 16px; }
  figure { margin: 0; background: #000; border-radius: 6px; overflow: hidden; }
  figure img { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; display: block; background: #000; }
  figcaption { padding: 8px 12px; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
  .off { color: #f28b82; }
  #markers { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header><h1>카메라 두 대</h1><a href="/">조종 화면</a></header>
<main>
  <figure>
    <img id="robot" src="/api/stream" alt="라즈봇 카메라 (길 찾기)">
    <figcaption><span>라즈봇 카메라 · 길 찾기</span><span id="markers">마커 —</span></figcaption>
  </figure>
  <figure>
    <img id="board" src="/api/board/stream" alt="XIAO 카메라 (AI 분류)">
    <figcaption><span>XIAO 카메라 · AI 분류</span><span id="boardstate"></span></figcaption>
  </figure>
</main>
<script>
  // 끊기면 몇 초 뒤 다시 붙는다
  for (const id of ['robot', 'board']) {
    const img = document.getElementById(id), src = img.getAttribute('src');
    img.addEventListener('error', () => {
      if (id === 'board') document.getElementById('boardstate').innerHTML = '<span class="off">사진이 안 옴 (판정 펌웨어이거나 연결 끊김)</span>';
      setTimeout(() => { img.src = src + '?t=' + Date.now(); }, 3000);
    });
    img.addEventListener('load', () => { if (id === 'board') document.getElementById('boardstate').textContent = ''; });
  }
  async function poll() {
    try {
      const r = await fetch('/api/markers');
      const d = await r.json();
      document.getElementById('markers').textContent =
        d.markers.length ? '마커 ' + d.markers.map(m => '#' + m.id).join(' ') : '마커 없음';
    } catch { document.getElementById('markers').textContent = '서버 연결 안 됨'; }
  }
  poll(); setInterval(poll, 1000);
</script>
</body>
</html>
